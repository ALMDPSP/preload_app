<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Preload – Abertura de Loja</title>
<style>
body { font-family: Arial; margin: 0; background: #f4f6f8; }
header {
    background: #2a5298;
    color: white;
    padding: 10px 20px;
}
header a {
    color: white;
    float: right;
    margin-left: 15px;
}
.container { padding: 20px; }
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}
th, td {
    border: 1px solid #ccc;
    padding: 5px;
}
th {
    background: #eee;
}
</style>
</head>
<body>

<header>
Preload – Abertura de Loja
<a href="/logout">Sair</a>
<a href="/">Dashboard</a>
</header>

<div class="container">

<h3>Novo Preload</h3>

<form method="POST" action="/salvar">
<input name="vd" placeholder="VD">
<input name="bandeira" placeholder="Bandeira">
<input name="loja" placeholder="Loja">
<input name="uf" placeholder="UF">
<input name="municipio" placeholder="Município">
<input name="cd_supridor" placeholder="CD Supridor">
<input name="montador" placeholder="Montador">
<input name="projeto" placeholder="Projeto">
<input name="entrada_ti">
<input name="envio_previsto">
<input name="term_obra">
<input name="cadastro">
<input name="sep_equip">
<input name="emissao_nfe">
<input name="link">
<input name="status">
<input name="cnpj">
<input name="precos_datahub">
<input name="preloading">
<input name="em_loja">
<textarea name="observacoes" placeholder="Observações"></textarea>
<button>Salvar</button>
</form>

<h3>Registros</h3>

<table>
<tr>
<th>VD</th><th>Loja</th><th>UF</th><th>Status</th><th>Ações</th>
</tr>

{% for r in registros %}
<tr>
<td>{{ r[0] }}</td>
<td>{{ r[2] }}</td>
<td>{{ r[3] }}</td>
<td>{{ r[15] }}</td>
<td>
<a href="/excluir/{{ r[0] }}">Excluir</a>
</td>
</tr>
{% endfor %}

</table>

</div>
</body>
</html>
