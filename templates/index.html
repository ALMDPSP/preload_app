<style>
.status-btn {
    border: none;
    font-size: 20px;
    cursor: pointer;
}

.vermelho { color: red; }
.amarelo { color: orange; }
.verde { color: green; }
.azul { color: blue; }

.card {
    border: 1px solid #ddd;
    padding: 20px;
    margin: 20px 0;
    border-radius: 10px;
    background: #f9f9f9;
}
</style>

<div class="card">

<h2>🏥 Filial - {{ registro.loja }}</h2>
<p>📆 Data Início: {{ registro.entrada_ti }}</p>
<p>📆 Data Término: {{ registro.term_obra }}</p>
<p>🌎 IP: {{ registro.link }}</p>

<hr>

<h3>LEGENDA</h3>
<p>🔴 - Pendente</p>
<p>🟡 - Em andamento</p>
<p>🟢 - Concluído</p>
<p>🔵 - Testes Pendente</p>

<hr>

<h3>MAQUINAS CONFIGURADAS</h3>

Servidor = 
<select name="servidor_status">
    <option value="vermelho">🔴</option>
    <option value="amarelo">🟡</option>
    <option value="verde">🟢</option>
    <option value="azul">🔵</option>
</select>

PDVs = 
<select name="pdv_status">
    <option value="vermelho">🔴</option>
    <option value="amarelo">🟡</option>
    <option value="verde">🟢</option>
    <option value="azul">🔵</option>
</select>

<hr>

<h3>PDV's</h3>

<select name="venda_dinheiro">
    <option value="verde">🟢 Venda Dinheiro</option>
    <option value="amarelo">🟡 Venda Dinheiro</option>
    <option value="vermelho">🔴 Venda Dinheiro</option>
</select>

<select name="venda_cartao">
    <option value="verde">🟢 Venda Cartão</option>
    <option value="amarelo">🟡 Venda Cartão</option>
    <option value="vermelho">🔴 Venda Cartão</option>
</select>

<hr>

<h3>OBSERVAÇÕES</h3>
<textarea name="obs" rows="4" style="width:100%">
{{ registro.obs }}
</textarea>

<button type="submit">Salvar</button>

</div>
