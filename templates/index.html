<!DOCTYPE html>
<html>
<head>
    <title>Preload</title>
    <style>
        body { font-family: Arial;background:#f4f6f9;margin:0 }
        header { background:#2f5597;color:white;padding:12px 20px;display:flex;justify-content:space-between }
        a { color:white;text-decoration:none;margin-left:15px }
        .container { padding:20px }
        table { width:100%;border-collapse:collapse;background:white }
        th,td { border:1px solid #ddd;padding:8px;text-align:center }
        th { background:#eee }
        input,textarea { width:100%;padding:6px }
        button { background:#2f5597;color:white;border:none;padding:8px 14px;margin-top:10px }
    </style>
</head>
<body>

<header>
    <strong>Preload – Abertura de Loja</strong>
    <div>
        <a href="/index">Dashboard</a>
        <a href="/logout">Sair</a>
    </div>
</header>

<div class="container">
<h3>Novo Preload</h3>

<form method="post" action="/salvar">
<input name="vd" placeholder="VD">
<input name="bandeira" placeholder="Bandeira">
<input name="loja" placeholder="Loja">
<input name="uf" placeholder="UF">
<input name="municipio" placeholder="Município">
<input name="cd_supridor" placeholder="CD Supridor">
<input name="montador" placeholder="Montador">
<input name="projeto" placeholder="Projeto">
<input name="entrada_ti" placeholder="Entrada TI">
<input name="envio_previsto" placeholder="Envio Previsto">
<input name="term_obra" placeholder="Term. Obra">
<input name="cadastro" placeholder="Cadastro">
<input name="sep_equip" placeholder="Sep. Equip">
<input name="emissao_nfe" placeholder="Emissão NF-e">
<input name="link" placeholder="Link">
<input name="status" placeholder="Status">
<input name="cnpj" placeholder="CNPJ">
<input name="precos_datahub" placeholder="Preços/DataHub">
<input name="preloading" placeholder="Preloading">
<input name="em_loja" placeholder="Em Loja">
<textarea name="observacoes" placeholder="Observações"></textarea>
<button>Salvar</button>
</form>

<h3>Registros</h3>
<table>
<tr>
<th>VD</th><th>Loja</th><th>UF</th><th>Status</th><th>Projeto</th><th>Ações</th>
</tr>
{% for r in registros %}
<tr>
<td>{{ r[1] }}</td>
<td>{{ r[2] }}</td>
<td>{{ r[3] }}</td>
<td>{{ r[4] }}</td>
<td>{{ r[5] }}</td>
<td>
<a href="/editar/{{ r[0] }}">✏️</a>
<a href="/excluir/{{ r[0] }}">🗑️</a>
</td>
</tr>
{% endfor %}
</table>

</div>
</body>
</html>
