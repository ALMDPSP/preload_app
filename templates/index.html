<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Preload</title>
</head>
<body style="font-family: Arial; margin:40px;">

<a href="/logout">🚪 Sair</a>

<h2>🏥 Preload Filial</h2>

<form method="POST" action="/salvar">

Loja:<br>
<input type="text" name="loja" value="{{ registro.loja if registro }}"><br><br>

📆 Data Início:<br>
<input type="text" name="entrada_ti" value="{{ registro.entrada_ti if registro }}"><br><br>

📆 Data Término:<br>
<input type="text" name="term_obra" value="{{ registro.term_obra if registro }}"><br><br>

🌎 IP:<br>
<input type="text" name="link" value="{{ registro.link if registro }}"><br><br>

<hr>

<h3>MAQUINAS CONFIGURADAS</h3>

Servidor:<br>
<input type="text" name="servidor" value="{{ registro.servidor if registro }}"><br><br>

PDVs:<br>
<input type="text" name="pdvs" value="{{ registro.pdvs if registro }}"><br><br>

Balcões:<br>
<input type="text" name="balcoes" value="{{ registro.balcoes if registro }}"><br><br>

Híbrido:<br>
<input type="text" name="hibrido" value="{{ registro.hibrido if registro }}"><br><br>

Treinamento:<br>
<input type="text" name="treinamento" value="{{ registro.treinamento if registro }}"><br><br>

<hr>

<h3>PDV's</h3>

Venda Dinheiro:<br>
<input type="text" name="venda_dinheiro" value="{{ registro.venda_dinheiro if registro }}"><br><br>

Venda Cartão:<br>
<input type="text" name="venda_cartao" value="{{ registro.venda_cartao if registro }}"><br><br>

Pix:<br>
<input type="text" name="pix" value="{{ registro.pix if registro }}"><br><br>

<hr>

Observações:<br>
<textarea name="observacoes" rows="4" style="width:300px;">{{ registro.observacoes if registro }}</textarea>

<br><br>
<button type="submit">💾 Salvar</button>

</form>

</body>
</html>
