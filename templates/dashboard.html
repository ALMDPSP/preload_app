<!DOCTYPE html>
<html>
<head>
<title>Preload</title>
<style>
body { font-family: Arial; margin:40px; }
.tab { padding:8px 15px; background:#eee; margin-right:5px; display:inline-block; }
.card { border:1px solid #ccc; padding:20px; margin-top:20px; }
select { font-size:16px; }
</style>
</head>
<body>

<a href="/logout">🚪 Sair</a>

<h2>Filiais Cadastradas</h2>

{% for f in filiais %}
<a class="tab" href="#">{{ f.loja }}</a>
{% endfor %}

<div class="card">

<form method="POST" action="/salvar">

🏥 Filial - <input name="loja"><br><br>
📆 Data Inicio: <input name="data_inicio"><br><br>
📆 Data Termino: <input name="data_termino"><br><br>
🌎 IP: <input name="ip"><br><br>

<h3>Legenda</h3>
🔴 Pendente | 🟡 Em andamento | 🟢 Concluído | 🔵 Testes

<h3>Máquinas Configuradas</h3>

Servidor:
<select name="servidor">
<option>🔴</option>
<option>🟡</option>
<option>🟢</option>
<option>🔵</option>
</select><br><br>

PDV's:
<select name="pdvs">
<option>🔴</option>
<option>🟡</option>
<option>🟢</option>
<option>🔵</option>
</select><br><br>

<h3>PDV's</h3>

Venda Dinheiro:
<select name="venda_dinheiro">
<option>🔴</option>
<option>🟡</option>
<option>🟢</option>
<option>🔵</option>
</select><br><br>

Venda Cartão:
<select name="venda_cartao">
<option>🔴</option>
<option>🟡</option>
<option>🟢</option>
<option>🔵</option>
</select><br><br>

Observações:<br>
<textarea name="obs" rows="4" style="width:100%"></textarea><br><br>

<button type="submit">💾 Salvar</button>

</form>

</div>

</body>
</html>
