<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family:Arial; margin:20px; background:#f4f6f9;}
.card { background:white; padding:20px; border-radius:12px; margin-bottom:20px;}
button { padding:10px; background:#0066ff; color:white; border:none;}
.tabs a { padding:8px; background:#ddd; margin:5px; display:inline-block; text-decoration:none;}
</style>
</head>
<body>

<h2>Bem-vindo {{ user.username }}</h2>
<a href="/logout">Sair</a>

<div class="card">
<h3>Resumo Executivo</h3>
Total: {{ total }} |
Concluídas: {{ concluidas }} |
{{ percentual }}%

<div style="background:#ddd;height:20px;border-radius:10px;">
<div style="width:{{ percentual }}%;background:green;height:20px;border-radius:10px;"></div>
</div>

<canvas id="grafico"></canvas>
</div>

<script>
new Chart(document.getElementById('grafico'), {
type:'doughnut',
data:{
labels:['Concluídas','Pendentes'],
datasets:[{data:[{{ concluidas }}, {{ total - concluidas }}]}]
}
});
</script>

<div class="card">
<h3>Nova Filial</h3>
<form method="POST" action="/salvar">
<input name="loja" placeholder="Filial">
<input name="entrada" placeholder="Data Início">
<input name="termino" placeholder="Data Término">
<input name="ip" placeholder="IP">

<select name="servidor">
<option>🔴</option>
<option>🟡</option>
<option>🟢</option>
<option>🔵</option>
</select>

<select name="pdvs">
<option>🔴</option>
<option>🟡</option>
<option>🟢</option>
<option>🔵</option>
</select>

<button type="submit">Salvar</button>
</form>
</div>

{% for f in filiais %}
<div class="card">
<b>{{ f.loja }}</b> - {{ f.servidor }}
</div>
{% endfor %}

</body>
</html>
