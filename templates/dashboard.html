<!DOCTYPE html>
<html>
<head>
<title>Preload Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family: Arial; margin:40px; background:#f4f6f9;}
.card { background:white; padding:20px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1);}
.tabs a { margin-right:10px; text-decoration:none; padding:8px 15px; background:#ddd; border-radius:6px;}
.tabs a:hover { background:#bbb;}
select { padding:5px; }
button { padding:10px 20px; background:#007bff; color:white; border:none; border-radius:5px;}
</style>
</head>
<body>

<h2>Bem-vindo {{ user.username }}</h2>
<a href="/logout">Sair</a>

<div class="tabs">
{% for f in filiais %}
<a href="/?edit={{f.id}}">{{ f.loja }}</a>
{% endfor %}
</div>

<div class="card">
<form method="POST" action="/salvar">

🏥 Filial <input name="loja"><br><br>
📆 Início <input name="data_inicio"><br><br>
📆 Término <input name="data_termino"><br><br>
🌎 IP <input name="ip"><br><br>

Servidor
<select name="servidor">
<option>🔴</option>
<option>🟡</option>
<option>🟢</option>
<option>🔵</option>
</select>

<br><br>

Venda Dinheiro
<select name="venda_dinheiro">
<option>🔴</option>
<option>🟡</option>
<option>🟢</option>
<option>🔵</option>
</select>

<br><br>

Observações
<textarea name="obs" style="width:100%"></textarea>

<br><br>
<button type="submit">Salvar</button>

</form>
</div>

<br><br>

<canvas id="grafico"></canvas>

<script>
new Chart(document.getElementById('grafico'), {
type: 'bar',
data: {
labels: ['Filiais'],
datasets: [{
label: 'Total cadastradas',
data: [{{ filiais|length }}]
}]
}
});
</script>

</body>
</html>
