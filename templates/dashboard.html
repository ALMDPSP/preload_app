<!DOCTYPE html>
<html>
<head>
    <title>Preload</title>
</head>
<body>

<header style="background:#2b5797;color:white;padding:10px">
    Preload – Abertura de Loja |
    <a href="/dashboard" style="color:white">Dashboard</a> |
    <a href="/logout" style="color:white">Sair</a>
</header>

<h3>Novo Preload</h3>

<form method="post" action="/salvar">
    <input name="vd" placeholder="VD">
    <input name="bandeira" placeholder="Bandeira">
    <input name="loja" placeholder="Loja">
    <input name="uf" placeholder="UF"><br><br>

    <input name="municipio" placeholder="Município">
    <input name="cd_supridor" placeholder="CD Supridor">
    <input name="montador" placeholder="Montador">
    <input name="projeto" placeholder="Projeto"><br><br>

    <input name="entrada_ti" placeholder="Entrada TI">
    <input name="envio_previsto" placeholder="Envio Previsto">
    <input name="term_obra" placeholder="Term. Obra">
    <input name="cadastro" placeholder="Cadastro"><br><br>

    <input name="sep_equip" placeholder="Sep. Equip">
    <input name="emissao_nfe" placeholder="Emissão NFe">
    <input name="link" placeholder="Link">
    <input name="status" placeholder="Status"><br><br>

    <input name="cnpj" placeholder="CNPJ">
    <input name="precos_datahub" placeholder="Preços/DataHub">
    <input name="preloading" placeholder="Preloading">
    <input name="em_loja" placeholder="Em Loja"><br><br>

    <textarea name="observacoes" placeholder="Observações"></textarea><br><br>

    <button>Salvar</button>
</form>

<h3>Registros</h3>

<table border="1" width="100%">
<tr>
    <th>VD</th><th>Loja</th><th>UF</th><th>Status</th><th>Projeto</th><th>Ações</th>
</tr>

{% for r in registros %}
<tr>
    <td>{{ r[1] }}</td>
    <td>{{ r[2] }}</td>
    <td>{{ r[3] }}</td>
    <td>{{ r[4] }}</td>
    <td>{{ r[5] }}</td>
    <td>
        <a href="/excluir/{{ r[0] }}">Excluir</a>
    </td>
</tr>
{% endfor %}
</table>

</body>
</html>
